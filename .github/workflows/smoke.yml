name: Smoke tests
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require deployed endpoints
        run: test -n "$BASE_URL" && test -n "$API_BASE_URL"
      - name: Run deployed smoke and Level 3 checks
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: |
            playwright-report/
            test-results/junit.xml
            test-results/**/*.png
          retention-days: 7
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require final project repository
        env:
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: test -n "$APP_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPOSITORY }}
          path: application
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run backend integration and domain tests
        run: dotnet test application/backend/Restaurant.Api.Tests/Restaurant.Api.Tests.csproj -c Release --logger 'trx;LogFileName=backend.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: application/backend/Restaurant.Api.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
