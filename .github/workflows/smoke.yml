name: Smoke tests
on:
  workflow_dispatch:
    inputs:
      run_owner_live:
        description: Run disposable authenticated owner API checks
        type: boolean
        default: false
      run_owner_waiter_live:
        description: Run owner and waiter UI test (leaves a submitted test reservation)
        type: boolean
        default: false
      run_confirmed_guests:
        description: Run email-backed guest E2E (leaves a submitted test reservation)
        type: boolean
        default: false
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require deployed endpoints
        run: test -n "$BASE_URL" && test -n "$API_BASE_URL"
      - name: Run deployed smoke and Level 3 checks
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: |
            playwright-report/
            test-results/junit.xml
            test-results/**/*.png
          retention-days: 7
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require final project repository
        env:
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: test -n "$APP_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPOSITORY }}
          path: application
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run backend integration and domain tests
        run: dotnet test application/backend/Restaurant.Api.Tests/Restaurant.Api.Tests.csproj -c Release --logger 'trx;LogFileName=backend.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: application/backend/Restaurant.Api.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
  owner-live:
    if: github.event_name == 'workflow_dispatch' && inputs.run_owner_live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      RUN_OWNER_LIVE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require test settings
        run: test -n "$BASE_URL" && test -n "$API_BASE_URL" && test -n "$OWNER_EMAIL" && test -n "$OWNER_PASSWORD"
      - run: npm run test:owner-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-live-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 7
  owner-waiter-live:
    needs: [smoke, owner-live]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_owner_waiter_live && needs.smoke.result == 'success' && (needs.owner-live.result == 'success' || needs.owner-live.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      WAITER_EMAIL: ${{ secrets.WAITER_EMAIL }}
      WAITER_PASSWORD: ${{ secrets.WAITER_PASSWORD }}
      RUN_SUBMIT_LIVE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require test settings
        run: test -n "$BASE_URL" && test -n "$API_BASE_URL" && test -n "$OWNER_EMAIL" && test -n "$OWNER_PASSWORD" && test -n "$WAITER_EMAIL" && test -n "$WAITER_PASSWORD"
      - run: npm run test:owner-waiter-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-waiter-live-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 7
  confirmed-guests-live:
    needs: [smoke, owner-live, owner-waiter-live]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_confirmed_guests && needs.smoke.result == 'success' && (needs.owner-live.result == 'success' || needs.owner-live.result == 'skipped') && (needs.owner-waiter-live.result == 'success' || needs.owner-waiter-live.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      WAITER_EMAIL: ${{ secrets.WAITER_EMAIL }}
      WAITER_PASSWORD: ${{ secrets.WAITER_PASSWORD }}
      GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RUN_CONFIRMED_GUESTS: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require test settings
        run: test -n "$BASE_URL" && test -n "$API_BASE_URL" && test -n "$OWNER_EMAIL" && test -n "$OWNER_PASSWORD" && test -n "$WAITER_EMAIL" && test -n "$WAITER_PASSWORD" && test -n "$GUEST_EMAIL" && test -n "$GMAIL_APP_PASSWORD"
      - run: npm run test:confirmed-guests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmed-guests-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 7
